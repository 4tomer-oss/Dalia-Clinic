<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שמירת איש קשר</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f6f9; }
        .card { text-align: center; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 300px; width: 90%; }
        .btn { display: inline-block; padding: 15px 30px; font-size: 18px; font-weight: bold; color: white; background-color: #007bff; border: none; border-radius: 50px; text-decoration: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,123,255,0.3); transition: background 0.2s; }
        .btn:active { background-color: #0056b3; }
        p { color: #6c757d; font-size: 14px; margin-bottom: 25px; }
    </style>
</head>
<body>

<div class="card">
    <h2>כרטיס ביקור דיגיטלי</h2>
    <p>פרטי איש הקשר יורדים כעת לטלפון שלך. אם ההורדה לא החלה, לחץ על הכפתור למטה:</p>
    <button id="download-btn" class="btn">שמור איש קשר</button>
</div>

<script>
    async function forceDownloadVcard() {
        try {
            // קריאת קובץ איש הקשר מהשרת
            const response = await fetch('contact.vcf');
            const text = await response.text();
            
            // יצירת קובץ וירטואלי בזיכרון הדפדפן שמאלץ הורדה באנדרואיד ובאייפון
            const blob = new Blob([text], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'contact.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        } catch (error) {
            console.error("Download failed, falling back:", error);
            window.location.href = 'contact.vcf';
        }
    }

    // הפעלה אוטומטית מיד כשהדף נפתח
    window.onload = function() {
        setTimeout(forceDownloadVcard, 300);
    };

    // גיבוי: הפעלה ידנית בלחיצה על הכפתור
    document.getElementById('download-btn').addEventListener('click', forceDownloadVcard);
</script>

</body>
</html>
